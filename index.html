<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EURORA LIVING</title>
<style>
:root{--bg:#e9edf1;--card:#fff;--ink:#101c26;--mut:#5d6b78;--acc:#0b5f8a;--red:#d62828;--grn:#1f9d4a;--line:#d3dae0}
@media(prefers-color-scheme:dark){:root{--bg:#0f151a;--card:#19222a;--ink:#e8eef2;--mut:#8fa0ad;--acc:#4fb0e3;--line:#2b3741;--grn:#4cd070}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:#0b3b57;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;align-items:center;gap:8px}
h1{font-size:22px;margin:0;flex:1;letter-spacing:.3px}
.hb{background:#ffffff26;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.d{background:var(--red);color:#fff}
#list{padding:6px 12px 50px}
.sum{display:flex;gap:6px;align-items:baseline;padding:14px 4px 2px;color:var(--mut);font-size:16px}
.sum .big{font-size:30px;font-weight:800;color:var(--red)}.sum .big.g{color:var(--grn);margin-left:8px}
.fl{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.fh,.row{display:flex;align-items:center;gap:12px;cursor:pointer}
.fh{padding:20px 14px 20px 16px;border-left:7px solid var(--acc)}
.fh b{font-size:24px}.fh .n{flex:1;color:var(--mut);font-size:15px}
.chev{font-size:20px;color:var(--mut);width:20px;text-align:center}
.row{padding:16px 14px 16px 18px;border-top:1px solid var(--line)}
.row b{font-size:26px;min-width:84px;letter-spacing:.5px}.row span{flex:1;color:var(--mut);font-size:15px}
.bd{display:flex;align-items:center;gap:10px}
.okb{font-weight:800;font-size:20px;color:var(--grn);white-space:nowrap}
.msg{padding:40px 20px;text-align:center;color:var(--mut)}
.msg input{width:100%;max-width:420px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:8px 0 12px}
.msg small{display:block;margin-top:18px;word-break:break-all}
#viewer{position:fixed;inset:0;background:#0d1114;z-index:10;display:none}
#vbar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;gap:8px;align-items:center;z-index:3;background:rgba(0,0,0,.6);color:#fff}
#vbar b{flex:1;font-size:20px}
#vbar .btn{background:#ffffff26;padding:8px 14px}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
#layer{position:absolute;left:0;top:0;transform-origin:0 0}
#plan{display:block;max-width:none;user-select:none;-webkit-user-drag:none;background:#fff}
.pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:4px solid #222;background:#fff;color:#111;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;transform:scale(var(--k,1));box-shadow:0 1px 5px #000a}
#sheet,#tp{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #0007;display:none}
#sheet textarea,#tp textarea{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none}
#tp h2{font-size:17px;margin:0 0 6px}#tp label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chip{flex:none;border:2px solid;border-radius:20px;padding:6px 13px;background:transparent;font-size:15px}
.chip.on{color:#fff;font-weight:700}
.srow{display:flex;gap:8px;align-items:center}
.sb{flex:none;padding:8px 13px}
#ph{height:44px;border-radius:8px;display:none}
.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{flex:1}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:40;display:none;max-width:90%}
.ed{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.eh{display:flex;align-items:center;gap:12px;padding:22px 14px 22px 16px;cursor:pointer;border-left:8px solid var(--acc)}
.eh b{font-size:26px}.eh .n{flex:1;color:var(--mut);font-size:15px}
.fh{border-top:1px solid var(--line);border-left:0;padding:16px 14px 16px 30px;background:color-mix(in srgb,var(--acc) 8%,transparent)}
.fh b{font-size:21px}
.row{padding-left:44px}
.nb{font-weight:800;font-size:22px;min-width:28px;text-align:center}.nb.r{color:var(--red)}.nb.g{color:var(--grn)}
.sums{display:flex;gap:10px;margin:14px 0 2px}.sc{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sc small{display:block;color:var(--mut);font-size:14px}.sc .big{font-size:40px;font-weight:800;line-height:1.1}
.acts .btn{flex:1;padding:11px 4px;font-size:14px;white-space:nowrap}#stato{flex:1.8}
.pin{user-select:none;-webkit-user-select:none}
#tp{top:50%;bottom:auto;left:50%;right:auto;transform:translate(-50%,-50%);width:min(92vw,420px);max-height:80vh;overflow:auto;border-radius:16px;padding:16px;box-shadow:0 0 0 100vmax #000a}
.tr{display:flex;gap:8px;align-items:center;margin:8px 0}
.tr input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sw{width:46px;height:38px;border-radius:8px;border:2px solid var(--line);flex:none;padding:0;cursor:pointer}
#tlist .sb{flex:none;padding:8px 12px}
#pal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#000a}
#pgrid{background:var(--card);padding:14px;border-radius:14px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;width:min(92vw,380px)}
#pgrid .sw{width:100%;height:44px}
html,body{touch-action:pan-x pan-y}
header{flex-wrap:wrap}h1{flex:1 1 100%}.hb{min-width:44px}
#plan{pointer-events:none;-webkit-touch-callout:none}
#stage,#layer,.pin{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
header{justify-content:space-between}.hg{display:flex;gap:8px}.hb{padding:10px 12px}
.pin::after{content:attr(data-n)}
#vbar .btn{padding:8px 11px}
#vbar{flex-wrap:wrap;justify-content:space-between}.vg{display:flex;gap:8px;align-items:center}#vbar b{flex:none}
#sp{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,360px);z-index:20;background:var(--card);border-radius:16px;padding:16px;display:none;box-shadow:0 0 0 100vmax #000a}
#sp h2{font-size:18px;margin:0 0 4px}.sr{display:flex;align-items:center;gap:10px;margin:14px 0}.sr b{flex:1}.sr span{min-width:56px;text-align:center;font-weight:700}
</style></head><body>
<div id="app">
<header><h1>EURORA LIVING</h1>
<button class="hb" id="bout">Esci</button>
<button class="hb" id="bset">⚙ Impostazioni</button>
<div class="hg"><button class="hb" id="btag">Categorie</button><button class="hb" id="bref" title="Aggiorna">⟳</button></div></header>
<div id="list"></div>
</div>

<div id="viewer">
 <div id="vbar"><div class="vg"><button class="btn" id="vback">←</button><b id="vt"></b></div><div class="vg"><button class="btn" id="zo">−</button><button class="btn" id="zf">Adatta</button><button class="btn" id="zi">+</button></div><div class="vg"><button class="btn" id="pm">○</button><button class="btn" id="pp">●</button></div></div>
 <div id="stage"><div id="layer"><img id="plan" alt="Pianta" draggable="false"></div></div>
</div>

<div id="sheet">
 <textarea id="desc" rows="2"></textarea>
 <div id="chips"></div>
 <img id="ph" alt="Foto">
 <input type="file" id="fcam" accept="image/*" capture="environment" hidden>
 <input type="file" id="fgal" accept="image/*" hidden>
 <div class="acts"><button class="btn g" id="stato">Aperta</button><button class="btn g" id="bcam">📷</button><button class="btn g" id="bgal">🖼</button><button class="btn g" id="cancel">Annulla</button><button class="btn d" id="del">🗑</button><button class="btn" id="save">Salva</button></div>
</div>
<div id="tp"><h2>Categorie</h2><div id="tlist"></div><button class="btn g" id="tadd">+ Aggiungi categoria</button><div class="acts"><button class="btn g" id="tcancel">Annulla</button><button class="btn" id="tsave">Salva</button></div></div>
<div id="sp"><h2>Impostazioni</h2>
<div class="sr"><b>Grafica</b><button class="btn g sb" id="uim">−</button><span id="uv"></span><button class="btn g sb" id="uip">+</button></div>
<div class="sr"><b>Pallini</b><button class="btn g sb" id="pm2">−</button><span id="pv"></span><button class="btn g sb" id="pp2">+</button></div>
<div class="acts"><button class="btn" id="sclose">Chiudi</button></div></div>
<div id="pal"><div id="pgrid"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),LS=localStorage;
const PAL=['#e6194b','#f58231','#4363d8','#911eb4','#42d4f4','#f032e6','#9a6324','#008080','#800000','#808000','#000075','#a9a9a9'];
const hx=(h,s,l)=>{s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')};
const COL=[...PAL];for(const l of[36,50,66])for(let h=0;h<360;h+=30)COL.push(hx(h,75,l));COL.push('#111111','#6b7280','#d1d5db');
const DEF=['Elettrico','Idraulico','Edile','Serramenti','Imbianchino','Pavimenti','Altro'].map((n,i)=>({n,c:PAL[i]}));
const CFG='/impostazioni/categorie.json';
let T=JSON.parse(LS.t||'null'),interni={},tags=DEF,cur=null,data=null,view={x:0,y:0,s:1},pin=null,dr={tag:'',done:false},isNew=false,photoBlob=null;
const cache={},openF=new Set(),redirect=location.origin+location.pathname;
const toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)};
const tagColor=n=>(tags.find(t=>t.n==n)||{}).c;

/* ---------- Scala interfaccia (solo elenco) ---------- */
let pz=parseFloat(LS.pz)||1;
let ui=parseFloat(LS.ui)||(innerWidth<600?1.3:1);
const vp=document.querySelector('meta[name=viewport]'),touch=navigator.maxTouchPoints>0;
const setUi=v=>{
 ui=Math.min(2,Math.max(.7,Math.round(v*10)/10));LS.ui=ui;$('#uv').textContent=Math.round(ui*100)+'%';
 if(touch)vp.setAttribute('content','width='+Math.round(screen.width/ui)+',user-scalable=no,viewport-fit=cover');
 else document.documentElement.style.zoom=ui;
};
$('#uim').onclick=()=>setUi(ui-.1);$('#uip').onclick=()=>setUi(ui+.1);
$('#bset').onclick=()=>$('#sp').style.display='block';$('#sclose').onclick=()=>$('#sp').style.display='none';
addEventListener('orientationchange',()=>setTimeout(()=>setUi(ui),400));setUi(ui);

/* ---------- Dropbox: accesso ---------- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
async function login(){
 const key=(($('#key')||{}).value||'').trim()||LS.appkey;
 if(!key)return toast('Inserisci la App key di Dropbox');
 if(!crypto.subtle)return toast('Serve una pagina https');
 LS.appkey=key;
 const v=b64(crypto.getRandomValues(new Uint8Array(32)));LS.v=v;
 const c=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
 location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:LS.appkey,response_type:'code',code_challenge:c,code_challenge_method:'S256',token_access_type:'offline',redirect_uri:redirect});
}
async function tok(body){
 const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({client_id:LS.appkey,...body})});
 if(!r.ok)throw Error(await r.text());const j=await r.json();
 T={a:j.access_token,r:j.refresh_token||(T&&T.r),e:Date.now()+j.expires_in*1000-60000};LS.t=JSON.stringify(T);
}
async function token(){if(!T)throw Error('no');if(Date.now()>T.e)await tok({grant_type:'refresh_token',refresh_token:T.r});return T.a}

/* ---------- Dropbox: file ---------- */
const esc=s=>s.replace(/[\u007f-\uffff]/g,c=>'\\u'+('000'+c.charCodeAt(0).toString(16)).slice(-4));
async function rpc(ep,body){
 const r=await fetch('https://api.dropboxapi.com/2/'+ep,{method:'POST',headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok)throw Error(await r.text());return r.json();
}
async function dl(path){
 const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':esc(JSON.stringify({path}))}});
 if(!r.ok)throw Error('dl'+r.status);return r.blob();
}
async function up(path,blob){
 const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':esc(JSON.stringify({path,mode:'overwrite',mute:true})),'Content-Type':'application/octet-stream'},body:blob});
 if(!r.ok)throw Error('up');
}
const jget=async p=>JSON.parse(await (await dl(p)).text());
const jput=(p,o)=>up(p,new Blob([JSON.stringify(o)],{type:'application/json'}));

/* ---------- Elenco ---------- */
async function load(){
 $('#list').innerHTML='<div class="msg">Caricamento…</div>';
 let r=await rpc('files/list_folder',{path:'',recursive:true,limit:2000}),all=r.entries;
 while(r.has_more){r=await rpc('files/list_folder/continue',{cursor:r.cursor});all=all.concat(r.entries)}
 interni={};
 for(const e of all){
  const p=e.path_display.split('/').filter(Boolean);
  if(p.length<3||/^impostazioni$/i.test(p[0]))continue;
  if(p.length==3&&e['.tag']!='folder')continue;
  const key=p.slice(0,3).join('/').toLowerCase();
  const i=interni[key]=interni[key]||{key,k:p[2].toUpperCase(),b:p[0],f:p[1],dir:'/'+p.slice(0,3).join('/')};
  if(p.length==4&&e['.tag']=='file'){
   if(/\.(jpe?g|png)$/i.test(p[3])&&(!i.plan||/^pianta\./i.test(p[3])))i.plan=e.path_display;
   if(p[3].toLowerCase()=='dati.json')i.has=1;
  }
 }
 try{const t=(await jget(CFG)).tags;if(!t||!t.length)throw Error('vuoto');tags=t}
 catch(e){tags=DEF;if(String(e.message)=='dl409')jput(CFG,{tags}).catch(()=>{})}
 await Promise.all(Object.values(interni).filter(i=>i.has).map(async i=>{try{i.d=await jget(i.dir+'/dati.json')}catch{}}));
 render();
}
const cnt=i=>{const p=(i.d&&i.d.pins)||[];return[p.filter(x=>!x.done).length,p.filter(x=>x.done).length]};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const natural=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
const sum=a=>a.reduce((s,i)=>{const c=cnt(i);return[s[0]+c[0],s[1]+c[1]]},[0,0]);
const nums=t=>`<span class="nb r">${t[0]}</span><span class="nb g">${t[1]}</span>`;
function render(){
 const L=Object.values(interni);
 if(!L.length){$('#list').innerHTML='<div class="msg">Nessuna cartella trovata. Nel Dropbox crea Edificio / Piano / Interno (es. A / piano 0 / a01), con la pianta JPEG dentro la cartella dell\'interno, poi tocca ⟳.</div>';return}
 const B={};L.forEach(i=>{B[i.b]=B[i.b]||{};(B[i.b][i.f]=B[i.b][i.f]||[]).push(i)});
 const all=sum(L);let h='';
 for(const b of Object.keys(B).sort(natural)){
  const fl=B[b],bi=Object.values(fl).flat();
  h+=`<div class="ed"><div class="eh" data-f="${b}"><b>${b.length<=2?'Edificio '+b.toUpperCase():cap(b)}</b><span class="n">${bi.length} interni</span>${nums(sum(bi))}<span class="chev">${openF.has(b)?'▾':'▸'}</span></div>`;
  if(openF.has(b))for(const f of Object.keys(fl).sort(natural)){
   const k=b+'/'+f,I=fl[f].sort((x,y)=>natural(x.k,y.k));
   h+=`<div class="fh" data-f="${k}"><b>${cap(f)}</b><span class="n">${I.length} interni</span>${nums(sum(I))}<span class="chev">${openF.has(k)?'▾':'▸'}</span></div>`
    +(openF.has(k)?I.map(i=>`<div class="row" data-k="${i.key}"><b>${i.k}</b><span>${i.plan?'':'manca la pianta'}</span>${nums(cnt(i))}</div>`).join(''):'');
  }
  h+='</div>';
 }
 $('#list').innerHTML=`<div class="sums"><div class="sc"><small>Attività aperte:</small><span class="big" style="color:var(--red)">${all[0]}</span></div><div class="sc"><small>Attività chiuse:</small><span class="big" style="color:var(--grn)">${all[1]}</span></div></div>`+h;
}
$('#list').onclick=e=>{
 const h=e.target.closest('.eh,.fh');
 if(h){const f=h.dataset.f;openF.has(f)?openF.delete(f):openF.add(f);return render()}
 const r=e.target.closest('.row');if(r)openInt(r.dataset.k);
};

/* ---------- Pianta ---------- */
function apply(){const l=$('#layer');l.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;l.style.setProperty('--k',pz/view.s)}
function fit(){
 const st=$('#stage'),im=$('#plan'),s=st.clientWidth/im.naturalWidth;
 view={s,x:0,y:$('#vbar').offsetHeight};apply();
}
function zoomAt(cx,cy,f){
 const s=Math.min(Math.max(view.s*f,.05),12);f=s/view.s;
 view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.s=s;apply();
}
function reveal(){
 if(!pin)return;const im=$('#plan');
 const sy=view.y+pin.y*im.naturalHeight*view.s,hi=innerHeight-$('#sheet').offsetHeight-40,lo=90;
 if(sy>hi)view.y-=sy-hi;else if(sy<lo)view.y+=lo-sy;apply();
}
function drawPins(){
 const L=$('#layer');L.querySelectorAll('.pin').forEach(x=>x.remove());
 const a=[...data.pins];if(pin&&isNew)a.push(pin);
 for(const p of a){
  const me=p===pin,t=me?dr.tag:p.tag,d=me?dr.done:p.done;
  const e=document.createElement('div');e.className='pin';e.dataset.id=p.id;e.dataset.n=p.n;
  e.style.left=p.x*100+'%';e.style.top=p.y*100+'%';
  if(!t){e.style.background='#f4ff2e';e.style.borderColor='#222'}
  else{const c=tagColor(t);e.style.borderColor=c||'#888';if(!c)e.style.borderStyle='dashed';e.style.background=d?'#5fd47a':'#fff'}
  L.appendChild(e);
 }
}
async function openInt(k){
 const i=interni[k];if(!i.plan)return toast('Manca la pianta JPEG nella cartella '+k);
 cur=i;data=i.d||{pins:[]};data.pins=data.pins||[];pin=null;
 $('#vt').textContent=k;$('#viewer').style.display='block';
 const im=$('#plan');im.onload=()=>{fit();drawPins()};
 try{if(!i.url)i.url=URL.createObjectURL(await dl(i.plan));im.src=i.url}catch{toast('Pianta non scaricata');closeViewer()}
}
function closeViewer(){closeSheet();$('#viewer').style.display='none';render()}
$('#vback').onclick=closeViewer;
$('#zi').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.4);
$('#zo').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/1.4);
$('#zf').onclick=fit;
const setPz=v=>{pz=Math.min(2.5,Math.max(.5,Math.round(v*10)/10));LS.pz=pz;$('#pv').textContent=Math.round(pz*100)+'%';apply()};
$('#pm').onclick=$('#pm2').onclick=()=>setPz(pz-.2);$('#pp').onclick=$('#pp2').onclick=()=>setPz(pz+.2);
$('#pv').textContent=Math.round(pz*100)+'%';

const P=new Map(),stg=$('#stage');let g=null;
$('#viewer').oncontextmenu=e=>e.preventDefault();
document.addEventListener('gesturestart',e=>e.preventDefault());
const pts=()=>[...P.values()],dist=()=>{const[a,b]=pts();return Math.hypot(a[0]-b[0],a[1]-b[1])},mid=()=>{const[a,b]=pts();return[(a[0]+b[0])/2,(a[1]+b[1])/2]};
stg.onpointerdown=e=>{
 stg.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size>1&&g){g.d=dist();g.m=99}
 else{
  const el=e.target.closest('.pin'),me=g={t:Date.now(),x:e.clientX,y:e.clientY,m:0,pin:el,p:el&&data.pins.find(x=>x.id==el.dataset.id),d:0};
  if(me.p)me.tm=setTimeout(()=>{if(g===me&&P.size==1&&me.m<8){me.drag=1;me.pin.style.outline='3px solid #fff';navigator.vibrate&&navigator.vibrate(40)}},450);
 }
};
stg.onpointermove=e=>{
 if(!P.has(e.pointerId)||!g)return;
 const o=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(g.drag){
  const r=$('#plan').getBoundingClientRect();
  g.p.x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));g.p.y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  g.pin.style.left=g.p.x*100+'%';g.pin.style.top=g.p.y*100+'%';return;
 }
 if(P.size==1){view.x+=e.clientX-o[0];view.y+=e.clientY-o[1];g.m=Math.max(g.m,Math.hypot(e.clientX-g.x,e.clientY-g.y));apply()}
 else if(P.size==2){const d=dist(),c=mid();zoomAt(c[0],c[1],d/g.d);g.d=d;g.m=99}
};
stg.onpointerup=stg.onpointercancel=e=>{
 P.delete(e.pointerId);
 if(P.size==0&&g){
  clearTimeout(g.tm);
  if(g.drag){g.pin.style.outline='';saveData().then(()=>toast('Posizione salvata')).catch(()=>toast('Errore: posizione non salvata'));g=null;return}
  if(g.m<8&&Date.now()-g.t<600&&e.type=='pointerup')tap(e,g.pin);g=null;
 }
};
stg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15)},{passive:false});
function tap(e,el){
 if(el){const p=data.pins.find(x=>x.id==el.dataset.id);if(p){if(p===pin)return;closeSheet();return edit(p,false)}}
 const r=$('#plan').getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 if(x<0||x>1||y<0||y>1)return;
 if(pin&&isNew){pin.x=x;pin.y=y;drawPins();return reveal()}
 if(pin)return closeSheet();
 const n=data.pins.reduce((m,p)=>Math.max(m,p.n),0)+1;
 edit({id:Date.now().toString(36),n,x,y,desc:'',tag:'',done:false,photo:''},true);
}

/* ---------- Segnalazione ---------- */
function chips(){
 const L=tags.some(t=>t.n==dr.tag)||!dr.tag?tags:[...tags,{n:dr.tag,c:'#888888'}];
 $('#chips').innerHTML=L.map(t=>`<button class="chip${t.n==dr.tag?' on':''}" data-n="${t.n.replace(/"/g,'&quot;')}" style="border-color:${t.c};${t.n==dr.tag?'background:'+t.c:''}">${t.n}</button>`).join('');
}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;dr.tag=b.dataset.n;chips();drawPins()};
function stato(){const b=$('#stato');b.textContent=dr.done?'✓ Risolta':'Aperta';b.style.background=dr.done?'#5fd47a':'';b.style.color=dr.done?'#111':''}
$('#stato').onclick=()=>{dr.done=!dr.done;stato();drawPins()};
async function edit(p,nuovo){
 pin=p;isNew=nuovo;photoBlob=null;dr={tag:tagColor(p.tag)?p.tag:'',done:!!p.done};
 $('#desc').value=p.desc||'';$('#desc').placeholder='Descrizione segnalazione '+p.n;
 chips();stato();$('#del').style.display=nuovo?'none':'';
 const ph=$('#ph');ph.style.display='none';ph.removeAttribute('src');
 $('#sheet').style.display='block';drawPins();reveal();
 if(p.photo){try{if(!cache[p.photo])cache[p.photo]=URL.createObjectURL(await dl(cur.dir+'/foto/'+p.photo));if(pin===p){ph.src=cache[p.photo];ph.style.display='block'}}catch{}}
}
function closeSheet(){$('#sheet').style.display='none';pin=null;if(data)drawPins()}
$('#cancel').onclick=closeSheet;
$('#bcam').onclick=()=>$('#fcam').click();
$('#bgal').onclick=()=>$('#fgal').click();
async function shrink(f){
 const b=await createImageBitmap(f),k=Math.min(1,1400/Math.max(b.width,b.height)),c=document.createElement('canvas');
 c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.8));
}
const onFoto=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{photoBlob=await shrink(f);$('#ph').src=URL.createObjectURL(photoBlob);$('#ph').style.display='block'}catch{toast('Foto non leggibile')}
 e.target.value='';
};
$('#fcam').onchange=$('#fgal').onchange=onFoto;
const saveData=async()=>{await jput(cur.dir+'/dati.json',data);cur.d=data;cur.has=1};
$('#save').onclick=async()=>{
 if(!dr.tag)return toast('Scegli una categoria');
 const p=pin,b=$('#save');b.disabled=true;b.textContent='Salvo…';
 const old={desc:p.desc,tag:p.tag,done:p.done,photo:p.photo};
 p.desc=$('#desc').value.trim();p.tag=dr.tag;p.done=dr.done;
 try{
  if(photoBlob){p.photo=`${cur.k}_${p.n}_${Date.now()}.jpg`;await up(cur.dir+'/foto/'+p.photo,photoBlob);cache[p.photo]=URL.createObjectURL(photoBlob)}
  if(isNew)data.pins.push(p);
  await saveData();closeSheet();toast('Salvato');
 }catch{
  Object.assign(p,old);if(isNew)data.pins=data.pins.filter(x=>x!==p);
  toast('Errore: salvataggio non riuscito, riprova');
 }
 b.disabled=false;b.textContent='Salva';
};
$('#del').onclick=async function(){
 if(!this.dataset.c){this.dataset.c=1;this.textContent='Sicuro?';setTimeout(()=>{delete this.dataset.c;this.textContent='🗑'},3000);return}
 delete this.dataset.c;this.textContent='🗑';
 const keep=data.pins;data.pins=keep.filter(x=>x!==pin);
 try{await saveData();closeSheet();toast('Eliminata')}catch{data.pins=keep;toast('Errore: non eliminata')}
};

/* ---------- Impostazioni ---------- */
$('#bref').onclick=()=>{if(T)start()};
let td=[],ti=0;
function trender(){
 const b=$('#tlist');
 b.innerHTML=td.map((t,i)=>`<div class="tr"><input data-i="${i}"${t.o?' readonly':''} placeholder="Nome categoria"><button class="sw" data-i="${i}" style="background:${t.c}"></button><button class="btn g sb" data-x="${i}">✕</button></div>`).join('');
 b.querySelectorAll('input').forEach(x=>x.value=td[x.dataset.i].n);
}
$('#tlist').oninput=e=>{if(e.target.tagName=='INPUT')td[e.target.dataset.i].n=e.target.value};
$('#tlist').onclick=e=>{
 const s=e.target.closest('.sw'),x=e.target.closest('[data-x]');
 if(s){ti=+s.dataset.i;$('#pal').style.display='flex'}
 if(x){td.splice(+x.dataset.x,1);trender()}
};
$('#pgrid').innerHTML=COL.map(c=>`<button class="sw" data-c="${c}" style="background:${c}"></button>`).join('');
$('#pal').onclick=e=>{const b=e.target.closest('[data-c]');if(b){td[ti].c=b.dataset.c;trender()}$('#pal').style.display='none'};
$('#btag').onclick=()=>{td=tags.map(t=>({...t,o:1}));trender();delete $('#tsave').dataset.w;$('#tsave').textContent='Salva';$('#tp').style.display='block'};
$('#tadd').onclick=()=>{const u=new Set(td.map(t=>t.c));td.push({n:'',c:PAL.find(c=>!u.has(c))||'#888888'});trender();const i=$('#tlist').querySelectorAll('input');i[i.length-1].focus()};
$('#tcancel').onclick=()=>$('#tp').style.display='none';
$('#tsave').onclick=async function(){
 const L=td.map(t=>({n:t.n.trim(),c:t.c})).filter(t=>t.n);
 if(!L.length)return toast('Inserisci almeno una categoria');
 const nm=new Set(L.map(t=>t.n)),gone=new Set(tags.filter(t=>!nm.has(t.n)).map(t=>t.n));
 let n=0;Object.values(interni).forEach(i=>((i.d&&i.d.pins)||[]).forEach(q=>{if(gone.has(q.tag))n++}));
 if(n&&!this.dataset.w){this.dataset.w=1;this.textContent='Conferma';return toast(n+' segnalazioni usano categorie eliminate e resteranno senza categoria. Tocca Conferma per procedere.')}
 delete this.dataset.w;this.textContent='Salva';
 try{await jput(CFG,{tags:L});tags=L;$('#tp').style.display='none';toast('Categorie salvate')}catch{toast('Errore nel salvataggio')}
};
$('#bout').onclick=function(){
 if(!this.dataset.c){this.dataset.c=1;this.textContent='Sicuro?';setTimeout(()=>{delete this.dataset.c;this.textContent='Esci'},3000);return}
 delete LS.t;T=null;location.reload();
};

/* ---------- Avvio ---------- */
async function start(){
 if(!T){$('#list').innerHTML=`<div class="msg"><p>Collega il tuo Dropbox per iniziare.</p><input id="key" placeholder="App key di Dropbox" autocomplete="off" value="${LS.appkey||''}"><br><button class="btn" id="lg">Collega Dropbox</button><small>Redirect URI da registrare su Dropbox (deve coincidere):<br><b>${redirect}</b></small></div>`;$('#lg').onclick=login;return}
 try{await load()}catch(e){$('#list').innerHTML='<div class="msg"><p>Impossibile leggere Dropbox. Controlla la connessione.</p><button class="btn" id="rt">Riprova</button></div>';$('#rt').onclick=start}
}
(async()=>{
 const q=new URLSearchParams(location.search),code=q.get('code'),er=q.get('error_description')||q.get('error');
 if(er){toast('Dropbox: '+er);history.replaceState(null,'',redirect)}
 if(code){try{await tok({grant_type:'authorization_code',code,code_verifier:LS.v,redirect_uri:redirect})}catch(e){toast('Accesso non riuscito: '+String(e.message).slice(0,120))}history.replaceState(null,'',redirect)}
 start();
})();
</script></body></html>

/* ---------- Dropbox: accesso ---------- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
async function login(){
 const key=(($('#key')||{}).value||'').trim()||LS.appkey;
 if(!key)return toast('Inserisci la App key di Dropbox');
 if(!crypto.subtle)return toast('Serve una pagina https');
 LS.appkey=key;
 const v=b64(crypto.getRandomValues(new Uint8Array(32)));LS.v=v;
 const c=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
 location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:LS.appkey,response_type:'code',code_challenge:c,code_challenge_method:'S256',token_access_type:'offline',redirect_uri:redirect});
}
async function tok(body){
 const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({client_id:LS.appkey,...body})});
 if(!r.ok)throw Error(await r.text());const j=await r.json();
 T={a:j.access_token,r:j.refresh_token||(T&&T.r),e:Date.now()+j.expires_in*1000-60000};LS.t=JSON.stringify(T);
}
async function token(){if(!T)throw Error('no');if(Date.now()>T.e)await tok({grant_type:'refresh_token',refresh_token:T.r});return T.a}

/* ---------- Dropbox: file ---------- */
const esc=s=>s.replace(/[\u007f-\uffff]/g,c=>'\\u'+('000'+c.charCodeAt(0).toString(16)).slice(-4));
async function rpc(ep,body){
 const r=await fetch('https://api.dropboxapi.com/2/'+ep,{method:'POST',headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok)throw Error(await r.text());return r.json();
}
async function dl(path){
 const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':esc(JSON.stringify({path}))}});
 if(!r.ok)throw Error('dl'+r.status);return r.blob();
}
async function up(path,blob){
 const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':esc(JSON.stringify({path,mode:'overwrite',mute:true})),'Content-Type':'application/octet-stream'},body:blob});
 if(!r.ok)throw Error('up');
}
const jget=async p=>JSON.parse(await (await dl(p)).text());
const jput=(p,o)=>up(p,new Blob([JSON.stringify(o)],{type:'application/json'}));

/* ---------- Elenco ---------- */
async function load(){
 $('#list').innerHTML='<div class="msg">Caricamento…</div>';loadTitle();
 let r=await rpc('files/list_folder',{path:'',recursive:true,limit:2000}),all=r.entries;
 while(r.has_more){r=await rpc('files/list_folder/continue',{cursor:r.cursor});all=all.concat(r.entries)}
 interni={};
 // 1) cartelle valide a qualsiasi profondità (escluse /impostazioni e le cartelle "foto" create dall'app)
 const dirs=new Map(),hasKid=new Set(),files=[];
 for(const e of all){
  const p=e.path_display.split('/').filter(Boolean);
  if(!p.length||/^impostazioni$/i.test(p[0])||p.some(x=>/^foto$/i.test(x)))continue;
  if(e['.tag']==='folder'){
   const key=p.join('/').toLowerCase();dirs.set(key,{key,p});
   if(p.length>1)hasKid.add(p.slice(0,-1).join('/').toLowerCase());
  }else if(e['.tag']==='file'&&p.length>=2)files.push({p,path:e.path_display});
 }
 // 2) "interno" = cartella ultima (senza sottocartelle)
 for(const [key,d] of dirs){
  if(hasKid.has(key))continue;
  const p=d.p;
  interni[key]={key,p,k:p[p.length-1].toUpperCase(),b:p[0],f:p.slice(1,-1).join(' / '),dir:'/'+p.join('/')};
 }
 // 3) file figli diretti: pianta (jpg/png con lo stesso nome della cartella) e dati.json
 for(const {p,path} of files){
  const i=interni[p.slice(0,-1).join('/').toLowerCase()];if(!i)continue;
  const fn=p[p.length-1];
  if(/\.(jpe?g|png)$/i.test(fn)&&fn.replace(/\.(jpe?g|png)$/i,'').toLowerCase()===p[p.length-2].toLowerCase())i.plan=path;
  if(fn.toLowerCase()==='dati.json')i.has=1;
 }
 try{const t=(await jget(CFG)).tags;if(!t||!t.length)throw Error('vuoto');tags=t}
 catch(e){tags=DEF;if(String(e.message)=='dl409')jput(CFG,{tags}).catch(()=>{})}
 await Promise.all(Object.values(interni).filter(i=>i.has).map(async i=>{try{i.d=await jget(i.dir+'/dati.json')}catch{}}));
 render();
}
const cnt=i=>{const p=(i.d&&i.d.pins)||[];return[p.filter(x=>!x.done).length,p.filter(x=>x.done).length]};
const urg=i=>!!(i.d&&i.d.priorita==='alta');
const DIA='<svg class="dia" viewBox="0 0 24 24"><path d="M12 1.5 22.5 12 12 22.5 1.5 12Z" fill="#d62828"/><path d="M12 6.8v7M12 16.6v1.6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>';
const ub=a=>{const u=a.filter(urg).length;return u?`<span class="ub">${DIA}${u}</span>`:''};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const hxe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* albero a profondità qualsiasi costruito dai percorsi degli interni */
function tree(L){
 const root={ch:new Map()};
 for(const i of L){let n=root;i.p.forEach((name,j)=>{const key=i.p.slice(0,j+1).join('/').toLowerCase();
  if(!n.ch.has(key))n.ch.set(key,{name,key,ch:new Map()});n=n.ch.get(key)});n.leaf=i}
 return root;
}
const leaves=n=>n.leaf?[n.leaf]:[...n.ch.values()].flatMap(leaves);
const kids=n=>[...n.ch.values()].sort((a,z)=>natural(a.name,z.name));
const lab0=(n,d)=>d==0&&n.name.length<=2?'Edificio '+n.name.toUpperCase():cap(n.name);
const ctx=i=>i.p.slice(0,-1).map((x,j)=>j==0&&x.length<=2?'EDIFICIO '+x:x).join(' / ').toUpperCase();
const natural=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
const sum=a=>a.reduce((s,i)=>{const c=cnt(i);return[s[0]+c[0],s[1]+c[1]]},[0,0]);
const nums=t=>`<span class="nb r">${t[0]}</span><span class="nb g">${t[1]}</span>`;
function render(){
 const L=Object.values(interni);
 if(!L.length){$('#list').innerHTML='<div class="msg">Nessuna cartella trovata. Nel Dropbox crea le cartelle (a qualsiasi livello, es. A / piano 0 / a01), con dentro nella cartella ultima la pianta JPEG che ha lo stesso nome della cartella (es. a01.jpg), poi tocca ⟳.</div>';return}
 const all=sum(L);let h='';
 const rnode=(n,d)=>{
  if(n.leaf){const i=n.leaf,pl=d==0?18:30+(d-1)*16;
   return `<div class="row" data-k="${hxe(i.key)}" style="padding-left:calc(${pl}px*var(--z))"><b>${urg(i)?DIA:''}${hxe(i.k)}</b><span>${i.plan?'':'manca '+esc(i.p[i.p.length-1].toLowerCase())+'.jpg'}</span>${nums(cnt(i))}</div>`}
  const I=leaves(n),o=openF.has(n.key);
  return `<div class="${d?'fh':'eh'}" data-f="${hxe(n.key)}"${d?` style="padding-left:calc(${30+(d-1)*16}px*var(--z))"`:''}><b>${hxe(lab0(n,d))}</b><span class="n">${I.length} interni</span>${ub(I)}${nums(sum(I))}<span class="chev">${o?'▾':'▸'}</span></div>`
   +(o?kids(n).map(c=>rnode(c,d+1)).join(''):'');
 };
 for(const n of kids(tree(L)))h+=`<div class="ed">${rnode(n,0)}</div>`;
 $('#list').innerHTML=`<div class="sums"><div class="sc" data-st="open" data-n="${all[0]}"><small>Attività aperte:</small><span class="big" style="color:var(--red)">${all[0]}</span>${all[0]?'<em>Tocca per il report</em>':''}</div><div class="sc" data-st="closed" data-n="${all[1]}"><small>Attività chiuse:</small><span class="big" style="color:var(--grn)">${all[1]}</span>${all[1]?'<em>Tocca per il report</em>':''}</div></div>`+h;
}
$('#list').onclick=e=>{
 const c=e.target.closest('.sc');if(c){if(+c.dataset.n>0)openReport(c.dataset.st);return}
 const h=e.target.closest('.eh,.fh');
 if(h){const f=h.dataset.f;openF.has(f)?openF.delete(f):openF.add(f);return render()}
 const r=e.target.closest('.row');if(r)openInt(r.dataset.k);
};

function fit(){
 const st=$('#stage'),im=$('#plan'),s=st.clientWidth/im.naturalWidth;

}
function zoomAt(cx,cy,f){

function reveal(){

const P=new Map(),stg=$('#stage');let g=null;
$('#viewer').oncontextmenu=e=>e.preventDefault();
document.addEventListener('gesturestart',e=>e.preventDefault());
const pts=()=>[...P.values()],dist=()=>{const[a,b]=pts();return Math.hypot(a[0]-b[0],a[1]-b[1])},mid=()=>{const[a,b]=pts();return[(a[0]+b[0])/2,(a[1]+b[1])/2]};
stg.onpointerdown=e=>{
 stg.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size>1&&g){g.d=dist();g.m=99}
 else{
  const el=e.target.closest('.pin'),me=g={t:Date.now(),x:e.clientX,y:e.clientY,m:0,pin:el,p:el&&data.pins.find(x=>x.id==el.dataset.id),d:0};
  if(me.p)me.tm=setTimeout(()=>{if(g===me&&P.size==1&&me.m<8){me.drag=1;me.pin.style.outline='3px solid #fff';navigator.vibrate&&navigator.vibrate(40)}},450);
 }
};
stg.onpointermove=e=>{
 if(!P.has(e.pointerId)||!g)return;
 const o=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(g.drag){
  const r=$('#plan').getBoundingClientRect();
  g.p.x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));g.p.y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  g.pin.style.left=g.p.x*100+'%';g.pin.style.top=g.p.y*100+'%';return;
 }
 if(P.size==1){view.x+=e.clientX-o[0];view.y+=e.clientY-o[1];g.m=Math.max(g.m,Math.hypot(e.clientX-g.x,e.clientY-g.y));apply()}
 else if(P.size==2){const d=dist(),c=mid();zoomAt(c[0],c[1],d/g.d);g.d=d;g.m=99}
};
stg.onpointerup=stg.onpointercancel=e=>{
 P.delete(e.pointerId);
 if(P.size==0&&g){
  clearTimeout(g.tm);
  if(g.drag){g.pin.style.outline='';saveData().then(()=>toast('Posizione salvata')).catch(()=>toast('Errore: posizione non salvata'));g=null;return}
  if(g.m<8&&Date.now()-g.t<600&&e.type=='pointerup')tap(e,g.pin);g=null;
 }
};
stg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15)},{passive:false});
function tap(e,el){
 if(el){const p=data.pins.find(x=>x.id==el.dataset.id);if(p){if(p===pin)return;closeSheet();return edit(p,false)}}
 const r=$('#plan').getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 if(x<0||x>1||y<0||y>1)return;
 if(pin&&isNew){pin.x=x;pin.y=y;drawPins();return reveal()}
 if(pin)return closeSheet();
 const n=data.pins.reduce((m,p)=>Math.max(m,p.n),0)+1;
 edit({id:Date.now().toString(36),n,x,y,desc:'',tag:'',done:false,photo:'',creato:iso()},true);
}

 const tot=a=>a.reduce((s,i)=>s+rcount(i).length,0),sel=a=>a.filter(i=>R.sel.has(i.key)).length;
 const pad=d=>`style="padding-left:calc(${d?22*d:4}px*var(--z))"`;
 const row=(lv,key,lab,a,op)=>{const n=tot(a),s=sel(a);return `<div class="tr2 l${Math.min(lv,2)}${n?'':' z'}" ${pad(lv)}><span class="ex" data-x="${hxe(key)}">${op?'▾':'▸'}</span><input type="checkbox" data-g="${hxe(key)}" data-s="${s==a.length?1:s?2:0}"><label>${hxe(lab)}</label><b>${n}</b></div>`};
 const walk=(n,d)=>{
  if(n.leaf){const i=n.leaf,c=rcount(i).length;return `<div class="tr2 l${Math.min(d,2)}${c?'':' z'}" ${pad(d)}><span class="ex"></span><input type="checkbox" data-i="${hxe(i.key)}"${R.sel.has(i.key)?' checked':''}><label>${hxe(i.k)}</label><b>${c}</b></div>`}
  const open=R.ob.has(n.key);
  return row(d,n.key,lab0(n,d),leaves(n),open)+(open?kids(n).map(c=>walk(c,d+1)).join(''):'');
 };
 let h='';for(const n of kids(tree(L)))h+=walk(n,0);
 const T=$('#rtree'),sc=T.scrollTop;T.innerHTML=h;T.scrollTop=sc;
 T.querySelectorAll('[data-g]').forEach(c=>{const s=+c.dataset.s;c.checked=s==1;c.indeterminate=s==2});
 const inc=L.filter(i=>R.sel.has(i.key)&&rcount(i).length),na=inc.reduce((s,i)=>s+rcount(i).length,0);
 $('#rsum').textContent=`Verranno inclusi ${inc.length} interni, ${na} attività`;$('#rgo').disabled=!inc.length;
}
$('#rtree').onclick=e=>{const x=e.target.closest('[data-x]');if(x&&x.dataset.x){const k=x.dataset.x;R.ob.has(k)?R.ob.delete(k):R.ob.add(k);rview()}};
$('#rtree').onchange=e=>{
 const c=e.target;
 if(c.dataset.g){const a=rgrp(c.dataset.g),all=a.every(i=>R.sel.has(i.key));a.forEach(i=>all?R.sel.delete(i.key):R.sel.add(i.key))}
 else if(c.dataset.i)c.checked?R.sel.add(c.dataset.i):R.sel.delete(c.dataset.i);
 rview();
};
$('#rcancel').onclick=()=>{R.stop=1;$('#rp').style.display='none'};
$('#rpr').onchange=e=>{R.pr=e.target.checked;rview()};

const loadPdf=()=>window.jspdf?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=ok;s.onerror=()=>ko(Error('libreria PDF non caricata'));document.head.appendChild(s)});
const rgb=h=>/^#[0-9a-f]{6}$/i.test(h||'')?[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)):[136,136,136];
const lat=s=>String(s||'').replace(/[^\u0000-\u00ff]/g,'');
async function planPic(i,pins){
 const bm=await createImageBitmap(await dl(i.plan)),k=Math.min(1,1600/Math.max(bm.width,bm.height)),W=Math.round(bm.width*k),H=Math.round(bm.height*k);
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(bm,0,0,W,H);
 const r=Math.max(13,W*.014);
 for(const p of pins){
  const cx=p.x*W,cy=p.y*H;x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle=p.done?'#5fd47a':'#fff';x.fill();
  x.lineWidth=r*.32;x.strokeStyle=tagColor(p.tag)||'#888888';x.stroke();
  x.fillStyle='#111';x.font='bold '+Math.round(r*1.05)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(p.n,cx,cy+r*.04);
 }
 return{u:c.toDataURL('image/jpeg',.82),w:W,h:H};
}
async function photoPic(i,f){
 const bm=await createImageBitmap(await dl(i.dir+'/foto/'+f)),k=Math.min(1,1100/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
 c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 return{u:c.toDataURL('image/jpeg',.78),w:c.width,h:c.height};
}
async function makeReport(){
 const btn=$('#rgo'),pg=$('#rpg');btn.disabled=true;R.stop=0;$('#rres').style.display='none';
 try{
  pg.textContent='Preparo…';await loadPdf();
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const inc=Object.values(interni).filter(i=>R.sel.has(i.key)&&rcount(i).length).sort((a,z)=>natural(a.p.join('/'),z.p.join('/')));
  const compact=$('#rcmp').checked,M=12,PW=210,IW=PW-2*M,CW=(IW-4)/2,BOT=284,closed=R.st=='closed';
  const title=lat($('#ttl').textContent||'').toUpperCase();
  let y=M,first=true;
  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(20);doc.text(`REPORT ${title} DEL ${fmt(iso())}`,M,y+5);y+=8;
  const cn=tags.filter(t=>R.cats.has(t.n)).map(t=>t.n);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90);
  doc.text(lat(`Attività ${closed?'chiuse':'aperte'}  ·  Categorie: ${cn.length==tags.length?'tutte':cn.join(', ')}${R.pr?'  ·  SOLO PRIORITÀ ALTA':''}`),M,y+3);
  y+=9;doc.setDrawColor(180);doc.line(M,y-3,PW-M,y-3);
  const np=()=>{doc.addPage();y=M},need=h=>{if(y+h>BOT)np()};
  let idx=0;
  for(const i of inc){
   if(R.stop)throw Error('stop');
   pg.textContent=`Interno ${++idx} di ${inc.length}: ${i.k}…`;
   const pins=rcount(i).sort((a,z)=>a.n-z.n),plan=await planPic(i,pins);
   const pics=await Promise.all(pins.map(p=>p.photo?photoPic(i,p.photo).catch(()=>null):null));
   // celle: la pianta e una scheda per ogni segnalazione
   const bw=compact?CW:IW,bh=compact?100:150,asp=plan.w/plan.h,pw=Math.min(bw,bh*asp);
   const cells=[{plan,w:pw,h:pw/asp}];
   doc.setFont('helvetica','normal');doc.setFontSize(9.5);
   pins.forEach((p,j)=>{
    const lines=doc.splitTextToSize(lat(p.desc)||'(nessuna descrizione)',CW),pic=pics[j];
    const dates=[p.creato&&'Creata '+fmt(p.creato),p.modificato&&'Modificata '+fmt(p.modificato)].filter(Boolean).join('  ·  ');
    let ph=0,pw2=0;if(pic){ph=Math.min(68,CW*pic.h/pic.w);pw2=ph*pic.w/pic.h}
    cells.push({p,lines,dates,pic,pw:pw2,ph,h:7+lines.length*4.2+(dates?4.6:0)+(pic?ph+2:0)+2});
   });
   // legenda categorie presenti
   doc.setFontSize(9);let lx=M,ly=0;const items=[];
   for(const c of [...new Set(pins.map(p=>p.tag))]){const w=doc.getTextWidth(lat(c))+8;if(lx+w>PW-M){lx=M;ly+=5}items.push({c,x:lx,y:ly});lx+=w+2}
   const HH=8,LH=ly+6,rows=[];
   if(compact){for(let j=0;j<cells.length;j+=2)rows.push(cells.slice(j,j+2))}
   else{rows.push([cells[0]]);for(let j=1;j<cells.length;j+=2)rows.push(cells.slice(j,j+2))}
   const rh=r=>Math.max(...r.map(c=>c.h));
   if(!compact&&!first)np();
   need(HH+LH+rh(rows[0])+2);
   // intestazione interno
   doc.setFillColor(232,236,240);doc.rect(M,y,IW,HH-1,'F');doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(20);
   doc.text(lat(`${i.k}${ctx(i)?'   '+ctx(i):''}`),M+2,y+5.3);
   if(urg(i)){
    doc.setFillColor(214,40,40);doc.rect(PW-M-44,y+.8,43.2,5.4,'F');doc.setFillColor(255,255,255);
    const cx=PW-M-40,cy=y+3.5;doc.triangle(cx,cy-2.2,cx+2.2,cy,cx,cy+2.2,'F');doc.triangle(cx,cy-2.2,cx-2.2,cy,cx,cy+2.2,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(255,255,255);doc.text('PRIORITÀ ALTA',PW-M-36.5,y+4.6);
   }
   y+=HH;
   doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(40);
   items.forEach(t=>{doc.setFillColor(...rgb(tagColor(t.c)));doc.rect(t.x,y+t.y+.6,3.2,3.2,'F');doc.text(lat(t.c),t.x+4.6,y+t.y+3.4)});
   y+=LH;
   rows.forEach((r,ri)=>{
    const h=rh(r);if(ri>0)need(h+2);
    r.forEach((c,ci)=>{
     const x=(!compact&&c.plan)?M:M+ci*(CW+4);
     if(c.plan){doc.addImage(c.plan.u,'JPEG',x,y,c.w,c.h);doc.setDrawColor(190);doc.rect(x,y,c.w,c.h)}
     else{
      doc.setFillColor(...rgb(tagColor(c.p.tag)));doc.circle(x+2.4,y+2.6,2.1,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(20);
      doc.text(lat(`n° ${c.p.n}   ${c.p.tag}  ·  ${c.p.done?'Risolta':'Aperta'}`),x+6,y+3.4);
      let yy=y+7;doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(30);
      c.lines.forEach(l=>{doc.text(l,x,yy+3);yy+=4.2});
      if(c.dates){doc.setFontSize(8);doc.setTextColor(120);doc.text(c.dates,x,yy+3);yy+=4.6}
      if(c.pic)doc.addImage(c.pic.u,'JPEG',x,yy+1,c.pw,c.ph);
     }
    });
    y+=h+2;
   });
   y+=3;first=false;
  }
  const n=doc.getNumberOfPages();
  for(let q=1;q<=n;q++){doc.setPage(q);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(130);doc.text(`Pagina ${q} di ${n}`,PW/2,291,{align:'center'})}
  const name=`Report_${title.replace(/[^A-Z0-9]+/g,'_')}_${iso()}.pdf`;
  R.blob=doc.output('blob');R.name=name;
  pg.textContent=`Report pronto: ${n} pagine, ${(R.blob.size/1048576).toFixed(1)} MB`;
  $('#rres').style.display='flex';$('#rcancel').textContent='Chiudi';
 }catch(e){pg.textContent=e.message=='stop'?'Annullato':'Errore: '+e.message}
 rview();
}
$('#rgo').onclick=makeReport;
$('#rop').onclick=()=>{if(!R.blob)return;if(!window.open(URL.createObjectURL(R.blob),'_blank'))toast('Apertura bloccata dal browser: usa Scarica')};
$('#rdl').onclick=()=>{if(!R.blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(R.blob);a.download=R.name;document.body.appendChild(a);a.click();a.remove()};
$('#rsh').onclick=async()=>{
 if(!R.blob)return;const f=new File([R.blob],R.name,{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){if(e.name!='AbortError')toast('Condivisione non riuscita')}}
 else toast('Condivisione non disponibile: usa Scarica');
};

/* ---------- Impostazioni ---------- */
$('#bref').onclick=()=>{if(T)start()};
let td=[],ti=0;
function trender(){
 const b=$('#tlist');
 b.innerHTML=td.map((t,i)=>`<div class="tr"><input data-i="${i}"${t.o?' readonly':''} placeholder="Nome categoria"><button class="sw" data-i="${i}" style="background:${t.c}"></button><button class="btn g sb" data-x="${i}">✕</button></div>`).join('');
 b.querySelectorAll('input').forEach(x=>x.value=td[x.dataset.i].n);
}
$('#tlist').oninput=e=>{if(e.target.tagName=='INPUT')td[e.target.dataset.i].n=e.target.value};
$('#tlist').onclick=e=>{
 const s=e.target.closest('.sw'),x=e.target.closest('[data-x]');
 if(s){ti=+s.dataset.i;$('#pal').style.display='flex'}
 if(x){td.splice(+x.dataset.x,1);trender()}
};
$('#pgrid').innerHTML=COL.map(c=>`<button class="sw" data-c="${c}" style="background:${c}"></button>`).join('');
$('#pal').onclick=e=>{const b=e.target.closest('[data-c]');if(b){td[ti].c=b.dataset.c;trender()}$('#pal').style.display='none'};
$('#btag').onclick=()=>{td=tags.map(t=>({...t,o:1}));trender();delete $('#tsave').dataset.w;$('#tsave').textContent='Salva';$('#tp').style.display='block'};
$('#tadd').onclick=()=>{const u=new Set(td.map(t=>t.c));td.push({n:'',c:PAL.find(c=>!u.has(c))||'#888888'});trender();const i=$('#tlist').querySelectorAll('input');i[i.length-1].focus()};
$('#tcancel').onclick=()=>$('#tp').style.display='none';
$('#tsave').onclick=async function(){
 const L=td.map(t=>({n:t.n.trim(),c:t.c})).filter(t=>t.n);
 if(!L.length)return toast('Inserisci almeno una categoria');
 const nm=new Set(L.map(t=>t.n)),gone=new Set(tags.filter(t=>!nm.has(t.n)).map(t=>t.n));
 let n=0;Object.values(interni).forEach(i=>((i.d&&i.d.pins)||[]).forEach(q=>{if(gone.has(q.tag))n++}));
 if(n&&!this.dataset.w){this.dataset.w=1;this.textContent='Conferma';return toast(n+' segnalazioni usano categorie eliminate e resteranno senza categoria. Tocca Conferma per procedere.')}
 delete this.dataset.w;this.textContent='Salva';
 try{await jput(CFG,{tags:L});tags=L;$('#tp').style.display='none';toast('Categorie salvate')}catch{toast('Errore nel salvataggio')}
};
$('#bout').onclick=function(){
 if(!this.dataset.c){this.dataset.c=1;this.textContent='Sicuro?';setTimeout(()=>{delete this.dataset.c;this.textContent='Esci'},3000);return}
 delete LS.t;T=null;location.reload();
};

/* ---------- Avvio ---------- */
async function start(){
 if(!T){$('#list').innerHTML=`<div class="msg"><p>Collega il tuo Dropbox per iniziare.</p><input id="key" placeholder="App key di Dropbox" autocomplete="off" value="${LS.appkey||''}"><br><button class="btn" id="lg">Collega Dropbox</button><small>Redirect URI da registrare su Dropbox (deve coincidere):<br><b>${redirect}</b></small></div>`;$('#lg').onclick=login;return}
 try{await load()}catch(e){$('#list').innerHTML='<div class="msg"><p>Impossibile leggere Dropbox. Controlla la connessione.</p><button class="btn" id="rt">Riprova</button></div>';$('#rt').onclick=start}
}
(async()=>{
 const q=new URLSearchParams(location.search),code=q.get('code'),er=q.get('error_description')||q.get('error');
 if(er){toast('Dropbox: '+er);history.replaceState(null,'',redirect)}
 if(code){try{await tok({grant_type:'authorization_code',code,code_verifier:LS.v,redirect_uri:redirect})}catch(e){toast('Accesso non riuscito: '+String(e.message).slice(0,120))}history.replaceState(null,'',redirect)}
 start();
})();

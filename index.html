<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lavori Palazzina</title>
<style>
:root{--bg:#eceff2;--card:#fff;--ink:#14212b;--mut:#62707c;--acc:#1b4f72;--red:#d62828;--grn:#2a9d4a;--line:#d5dbe0}
@media(prefers-color-scheme:dark){:root{--bg:#12181d;--card:#1b232a;--ink:#e6ecf0;--mut:#93a1ad;--acc:#5fa3d0;--line:#2c3740}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top)}
button,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;position:sticky;top:env(safe-area-inset-top);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
h1{font-size:19px;margin:0;flex:1}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.d{background:var(--red)}
#list{padding:6px 12px 40px;max-width:640px;margin:0 auto}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:8px 0;cursor:pointer}
.row b{font-size:19px;min-width:56px}.row span{color:var(--mut);flex:1;font-size:14px}
.ind{min-width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;padding:0 6px}
.ind.o{background:var(--red)}.ind.k{background:var(--grn)}
.msg{padding:40px 20px;text-align:center;color:var(--mut)}
.msg input{width:100%;max-width:420px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:8px 0 12px}
.msg small{display:block;margin-top:18px;word-break:break-all}
#viewer{position:fixed;inset:0;background:#0d1114;z-index:10;display:none}
#vbar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;gap:8px;align-items:center;z-index:3;background:rgba(0,0,0,.6);color:#fff}
#vbar b{flex:1;font-size:18px}
#vbar .btn{background:#ffffff22;padding:8px 14px}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
#layer{position:absolute;left:0;top:0;transform-origin:0 0}
#plan{display:block;max-width:none;user-select:none;-webkit-user-drag:none;background:#fff}
.pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:3px solid var(--red);background:#fff;color:#111;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;transform:scale(var(--k,1));box-shadow:0 1px 4px #0009}
.pin.k{border-color:var(--grn)}
#sheet,#tp{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px #0006;display:none;max-height:88%;overflow:auto}
#sheet h2,#tp h2{font-size:17px;margin:0 0 4px}
#sheet label,#tp label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
#sheet textarea,#sheet select,#tp textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.two{display:flex;gap:8px}.two>div,.two>.btn{flex:1}
.acts{display:flex;gap:8px;margin-top:14px}.acts .btn{flex:1}
#ph{max-width:100%;max-height:220px;border-radius:10px;margin-top:8px;display:none}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:40;display:none}
</style></head><body>
<header><h1>Lavori Palazzina</h1>
<button class="btn g" id="bref" title="Aggiorna">⟳</button>
<button class="btn g" id="btag">Tag</button>
<button class="btn g" id="bout">Esci</button></header>
<div id="list"></div>

<div id="viewer">
 <div id="vbar"><button class="btn" id="vback">←</button><b id="vt"></b>
 <button class="btn" id="zo">−</button><button class="btn" id="zf">Adatta</button><button class="btn" id="zi">+</button></div>
 <div id="stage"><div id="layer"><img id="plan" alt="Pianta" draggable="false"></div></div>
</div>

<div id="sheet">
 <h2 id="sn"></h2>
 <label for="desc">Descrizione</label><textarea id="desc" rows="3"></textarea>
 <div class="two">
  <div><label for="tag">Tag</label><select id="tag"></select></div>
  <div><label for="stato">Stato</label><select id="stato"><option value="0">Aperta</option><option value="1">Risolta</option></select></div>
 </div>
 <label>Foto</label>
 <input type="file" id="fcam" accept="image/*" capture="environment" hidden>
 <input type="file" id="fgal" accept="image/*" hidden>
 <div class="two"><button class="btn g" id="bcam">📷 Scatta</button><button class="btn g" id="bgal">🖼 Galleria</button></div>
 <img id="ph" alt="Foto segnalazione">
 <div class="acts"><button class="btn g" id="cancel">Annulla</button><button class="btn d" id="del">Elimina</button><button class="btn" id="save">Salva</button></div>
</div>
<div id="tp"><h2>Tag</h2><label for="tl">Uno per riga</label><textarea id="tl" rows="8"></textarea><div class="acts"><button class="btn g" id="tcancel">Annulla</button><button class="btn" id="tsave">Salva</button></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),LS=localStorage;
const DEF_TAGS=['Elettrico','Idraulico','Edile','Serramenti','Imbianchino','Pavimenti','Altro'];
let T=JSON.parse(LS.t||'null'),interni={},tags=DEF_TAGS,cur=null,data=null,view={x:0,y:0,s:1},pin=null,isNew=false,photoBlob=null;
const cache={},redirect=location.origin+location.pathname;
const toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)};

/* ---------- Dropbox: accesso (OAuth PKCE, rinnovo automatico) ---------- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
async function login(){
 const key=(($('#key')||{}).value||'').trim()||LS.appkey;
 if(!key)return toast('Inserisci la App key di Dropbox');
 if(!crypto.subtle)return toast('Serve una pagina https');
 LS.appkey=key;
 const v=b64(crypto.getRandomValues(new Uint8Array(32)));LS.v=v;
 const c=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
 location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:LS.appkey,response_type:'code',code_challenge:c,code_challenge_method:'S256',token_access_type:'offline',redirect_uri:redirect});
}
async function tok(body){
 const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({client_id:LS.appkey,...body})});
 if(!r.ok)throw Error(await r.text());const j=await r.json();
 T={a:j.access_token,r:j.refresh_token||(T&&T.r),e:Date.now()+j.expires_in*1000-60000};LS.t=JSON.stringify(T);
}
async function token(){if(!T)throw Error('no');if(Date.now()>T.e)await tok({grant_type:'refresh_token',refresh_token:T.r});return T.a}

/* ---------- Dropbox: file ---------- */
const esc=s=>s.replace(/[\u007f-\uffff]/g,c=>'\\u'+('000'+c.charCodeAt(0).toString(16)).slice(-4));
async function rpc(ep,body){
 const r=await fetch('https://api.dropboxapi.com/2/'+ep,{method:'POST',headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok)throw Error(await r.text());return r.json();
}
async function dl(path){
 const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':esc(JSON.stringify({path}))}});
 if(!r.ok)throw Error('dl');return r.blob();
}
async function up(path,blob){
 const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':esc(JSON.stringify({path,mode:'overwrite',mute:true})),'Content-Type':'application/octet-stream'},body:blob});
 if(!r.ok)throw Error('up');
}
const jget=async p=>JSON.parse(await (await dl(p)).text());

/* ---------- Elenco interni ---------- */
async function load(){
 $('#list').innerHTML='<div class="msg">Caricamento…</div>';
 let r=await rpc('files/list_folder',{path:'',recursive:true,limit:2000}),all=r.entries;
 while(r.has_more){r=await rpc('files/list_folder/continue',{cursor:r.cursor});all=all.concat(r.entries)}
 interni={};
 for(const e of all){
  const p=e.path_display.split('/').filter(Boolean);
  if(p[0]&&/^[A-Za-z]\d{2}$/.test(p[0])){
   const i=interni[p[0].toUpperCase()]=interni[p[0].toUpperCase()]||{k:p[0].toUpperCase(),dir:'/'+p[0]};
   if(p.length==2&&e['.tag']=='file'){
    if(/\.(jpe?g|png)$/i.test(p[1])&&!i.plan)i.plan=e.path_display;
    if(p[1].toLowerCase()=='dati.json')i.has=1;
   }
  }
 }
 try{tags=(await jget('/config.json')).tags||DEF_TAGS}catch{tags=DEF_TAGS}
 await Promise.all(Object.values(interni).filter(i=>i.has).map(async i=>{try{i.d=await jget(i.dir+'/dati.json')}catch{}}));
 render();
}
function ind(i){
 const p=(i.d&&i.d.pins)||[];if(!p.length)return'';
 const o=p.filter(x=>!x.done).length;
 return o?`<div class="ind o">${o}</div>`:'<div class="ind k">✓</div>';
}
function render(){
 const L=Object.values(interni).sort((a,b)=>a.k.localeCompare(b.k));
 $('#list').innerHTML=L.length?L.map(i=>`<div class="row" data-k="${i.k}"><b>${i.k}</b><span>${i.plan?'':'manca la pianta JPEG'}</span>${ind(i)}</div>`).join(''):'<div class="msg">Nessuna cartella trovata. Nel Dropbox crea una cartella per interno (A14, A15…) con dentro la pianta in JPEG, poi tocca ⟳.</div>';
}
$('#list').onclick=e=>{const r=e.target.closest('.row');if(r)openInt(r.dataset.k)};

/* ---------- Pianta: zoom, pan, pin ---------- */
function apply(){const l=$('#layer');l.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;l.style.setProperty('--k',1/view.s)}
function fit(){
 const st=$('#stage'),im=$('#plan'),s=Math.min(st.clientWidth/im.naturalWidth,st.clientHeight/im.naturalHeight);
 view={s,x:(st.clientWidth-im.naturalWidth*s)/2,y:(st.clientHeight-im.naturalHeight*s)/2};apply();
}
function zoomAt(cx,cy,f){
 const s=Math.min(Math.max(view.s*f,.05),12);f=s/view.s;
 view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.s=s;apply();
}
function drawPins(){
 const L=$('#layer');L.querySelectorAll('.pin').forEach(p=>p.remove());
 for(const p of data.pins){const d=document.createElement('div');d.className='pin'+(p.done?' k':'');d.dataset.id=p.id;d.textContent=p.n;d.style.left=p.x*100+'%';d.style.top=p.y*100+'%';L.appendChild(d)}
}
async function openInt(k){
 const i=interni[k];if(!i.plan)return toast('Manca la pianta JPEG nella cartella '+k);
 cur=i;data=i.d||{pins:[]};data.pins=data.pins||[];
 $('#vt').textContent=k;$('#viewer').style.display='block';
 const im=$('#plan');im.onload=()=>{fit();drawPins()};
 try{if(!i.url)i.url=URL.createObjectURL(await dl(i.plan));im.src=i.url}catch{toast('Pianta non scaricata');closeViewer()}
}
function closeViewer(){$('#viewer').style.display='none';closeSheet();render()}
$('#vback').onclick=closeViewer;
$('#zi').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.4);
$('#zo').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/1.4);
$('#zf').onclick=fit;

const P=new Map(),stg=$('#stage');let g=null;
const pts=()=>[...P.values()],dist=()=>{const[a,b]=pts();return Math.hypot(a[0]-b[0],a[1]-b[1])},mid=()=>{const[a,b]=pts();return[(a[0]+b[0])/2,(a[1]+b[1])/2]};
stg.onpointerdown=e=>{
 stg.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size>1&&g){g.d=dist();g.m=99}
 else g={t:Date.now(),x:e.clientX,y:e.clientY,m:0,pin:e.target.closest('.pin'),d:0};
};
stg.onpointermove=e=>{
 if(!P.has(e.pointerId)||!g)return;
 const o=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size==1){view.x+=e.clientX-o[0];view.y+=e.clientY-o[1];g.m=Math.max(g.m,Math.hypot(e.clientX-g.x,e.clientY-g.y));apply()}
 else if(P.size==2){const d=dist(),c=mid();zoomAt(c[0],c[1],d/g.d);g.d=d;g.m=99}
};
stg.onpointerup=stg.onpointercancel=e=>{
 P.delete(e.pointerId);
 if(P.size==0&&g){
  if(g.m<8&&Date.now()-g.t<600&&e.type=='pointerup')tap(e,g.pin);
  g=null;
 }
};
stg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15)},{passive:false});
function tap(e,el){
 if($('#sheet').style.display=='block')return closeSheet();
 if(el){const p=data.pins.find(x=>x.id==el.dataset.id);if(p)return edit(p,false)}
 const r=$('#plan').getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 if(x<0||x>1||y<0||y>1)return;
 const n=data.pins.reduce((m,p)=>Math.max(m,p.n),0)+1;
 edit({id:Date.now().toString(36),n,x,y,desc:'',tag:tags[0],done:false,photo:''},true);
}

/* ---------- Segnalazione ---------- */
async function edit(p,nuovo){
 pin=p;isNew=nuovo;photoBlob=null;
 $('#sn').textContent='Segnalazione '+p.n;$('#desc').value=p.desc||'';
 const tl=tags.includes(p.tag)||!p.tag?tags:[...tags,p.tag];
 $('#tag').innerHTML=tl.map(t=>`<option${t==p.tag?' selected':''}>${t}</option>`).join('');
 $('#stato').value=p.done?'1':'0';$('#del').style.display=nuovo?'none':'';
 const ph=$('#ph');ph.style.display='none';ph.removeAttribute('src');
 $('#sheet').style.display='block';
 if(p.photo){
  try{if(!cache[p.photo])cache[p.photo]=URL.createObjectURL(await dl(cur.dir+'/foto/'+p.photo));if(pin===p){ph.src=cache[p.photo];ph.style.display='block'}}catch{}
 }
}
function closeSheet(){$('#sheet').style.display='none';pin=null}
$('#cancel').onclick=closeSheet;
$('#bcam').onclick=()=>$('#fcam').click();
$('#bgal').onclick=()=>$('#fgal').click();
async function shrink(f){
 const b=await createImageBitmap(f),k=Math.min(1,1400/Math.max(b.width,b.height)),c=document.createElement('canvas');
 c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.8));
}
const onFoto=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{photoBlob=await shrink(f);$('#ph').src=URL.createObjectURL(photoBlob);$('#ph').style.display='block'}catch{toast('Foto non leggibile')}
 e.target.value='';
};
$('#fcam').onchange=$('#fgal').onchange=onFoto;
async function saveData(){await up(cur.dir+'/dati.json',new Blob([JSON.stringify(data)],{type:'application/json'}));cur.d=data;cur.has=1}
$('#save').onclick=async()=>{
 const p=pin,b=$('#save');b.disabled=true;b.textContent='Salvo…';
 const old={desc:p.desc,tag:p.tag,done:p.done,photo:p.photo};
 p.desc=$('#desc').value.trim();p.tag=$('#tag').value;p.done=$('#stato').value=='1';
 try{
  if(photoBlob){p.photo=`${cur.k}_${p.n}_${Date.now()}.jpg`;await up(cur.dir+'/foto/'+p.photo,photoBlob);cache[p.photo]=URL.createObjectURL(photoBlob)}
  if(isNew)data.pins.push(p);
  await saveData();closeSheet();drawPins();toast('Salvato');
 }catch{
  Object.assign(p,old);if(isNew)data.pins=data.pins.filter(x=>x!==p);
  toast('Errore: salvataggio non riuscito, riprova');
 }
 b.disabled=false;b.textContent='Salva';
};
$('#del').onclick=async function(){
 if(!this.dataset.c){this.dataset.c=1;this.textContent='Confermi?';setTimeout(()=>{delete this.dataset.c;this.textContent='Elimina'},3000);return}
 delete this.dataset.c;this.textContent='Elimina';
 const keep=data.pins;data.pins=keep.filter(x=>x!==pin);
 try{await saveData();closeSheet();drawPins();toast('Eliminata')}catch{data.pins=keep;toast('Errore: non eliminata')}
};

/* ---------- Impostazioni ---------- */
$('#bref').onclick=()=>{if(T)start()};
$('#btag').onclick=()=>{$('#tl').value=tags.join('\n');$('#tp').style.display='block'};
$('#tcancel').onclick=()=>$('#tp').style.display='none';
$('#tsave').onclick=async()=>{
 const l=$('#tl').value.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);if(!l.length)return toast('Inserisci almeno un tag');
 try{await up('/config.json',new Blob([JSON.stringify({tags:l})]));tags=l;$('#tp').style.display='none';toast('Tag salvati')}catch{toast('Errore nel salvataggio dei tag')}
};
$('#bout').onclick=function(){
 if(!this.dataset.c){this.dataset.c=1;this.textContent='Sicuro?';setTimeout(()=>{delete this.dataset.c;this.textContent='Esci'},3000);return}
 delete LS.t;T=null;location.reload();
};

/* ---------- Avvio ---------- */
async function start(){
 if(!T){$('#list').innerHTML=`<div class="msg"><p>Collega il tuo Dropbox per iniziare.</p><input id="key" placeholder="App key di Dropbox" autocomplete="off" value="${LS.appkey||''}"><br><button class="btn" id="lg">Collega Dropbox</button><small>Redirect URI da registrare su Dropbox (deve coincidere):<br><b>${redirect}</b></small></div>`;$('#lg').onclick=login;return}
 try{await load()}catch(e){$('#list').innerHTML='<div class="msg"><p>Impossibile leggere Dropbox. Controlla la connessione.</p><button class="btn" id="rt">Riprova</button></div>';$('#rt').onclick=start}
}
(async()=>{
 const q=new URLSearchParams(location.search),code=q.get('code'),er=q.get('error_description')||q.get('error');
 if(er){toast('Dropbox: '+er);history.replaceState(null,'',redirect)}
 if(code){try{await tok({grant_type:'authorization_code',code,code_verifier:LS.v,redirect_uri:redirect})}catch(e){toast('Accesso non riuscito: '+String(e.message).slice(0,120))}history.replaceState(null,'',redirect)}
 start();
})();
</script></body></html>
